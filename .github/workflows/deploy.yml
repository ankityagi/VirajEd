name: Deploy to GitHub Pages

# Publishes the site to viraj.ankityagi.online (same setup as games.ankityagi.online).
# The site is plain HTML/CSS/JS, so there is no build step: the repo root is uploaded as-is.
on:
  push:
    branches: [main, claude/viraj-practice-questions-3if9sc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js CNAME .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
